services:
  - type: web
    name: nfl-results-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: NFL_SEASON
        value: 2026
      - key: NFL_DB
        value: /var/data/nfl_results.db
    disk:
      name: nfl-data
      mountPath: /var/data
      sizeGB: 1
