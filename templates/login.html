<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Degenerates — Members Only</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="member-login-page">
  <div class="football-bg" aria-hidden="true">
    <div class="stadium-glow stadium-glow-left"></div>
    <div class="stadium-glow stadium-glow-right"></div>
    <div class="field-perspective">
      <span class="yard y10"></span><span class="yard y20"></span><span class="yard y30"></span>
      <span class="yard y40"></span><span class="yard y50"></span><span class="field-center"></span>
    </div>
  </div>

  <main class="member-login-shell">
    <section class="member-login-card">
      <div class="login-football-mark" aria-hidden="true">🏈</div>
      <div class="login-kicker">{{season}} MEMBER ACCESS</div>
      <h1>NFL Degenerates</h1>
      <p class="login-subtitle">Private pool access for members.</p>

      {% if error %}
      <div class="login-error">{{error}}</div>
      {% endif %}

      <form method="post" action="/login" class="member-login-form">
        <input type="hidden" name="next" value="{{next_path}}">
        <label for="password">Member Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required placeholder="Enter member password">
        <button type="submit">ENTER THE POOL</button>
      </form>

      <p class="login-help">Contact the pool commissioner if you need the current member password.</p>
    </section>
  </main>
</body>
</html>
